<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Splash, tema escuro: a folha com o vidro e o tint do escuro (cartao
    rgba(26,34,52,.558), tint #9FBEDF), sobre a cor de fundo do splash (#06080F).
    A geometria é a mesma nos sete SVG desta pasta; mudou um, mude os outros.
    Exporte com `node assets/icone/exportar.mjs` (em mobile/).
  -->
  <defs>
    <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".26"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity=".3"/>
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#FFFFFF" flood-opacity=".07"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="28"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <clipPath id="folha"><rect x="212" y="247" width="600" height="530" rx="136"/></clipPath>
  </defs>

  <!-- folha de vidro -->
  <rect x="212" y="247" width="600" height="530" rx="136" fill="rgba(26,34,52,.558)" filter="url(#sombra)"/>
  <rect x="212" y="247" width="600" height="530" rx="136" fill="#000" filter="url(#halo)"/>
  <!-- cabeçalho da folha e check, no tint -->
  <rect x="212" y="247" width="600" height="148" fill="#9FBEDF" clip-path="url(#folha)"/>
  <path d="M362 579 L462 679 L662 479" fill="none" stroke="#9FBEDF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- reflexo e borda do vidro, por cima do cabeçalho -->
  <rect x="216" y="251" width="592" height="522" rx="132" fill="none" stroke="url(#reflexo)" stroke-width="8"/>
  <rect x="212" y="247" width="600" height="530" rx="136" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="3"/>
</svg>
