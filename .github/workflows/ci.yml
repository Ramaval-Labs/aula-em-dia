name: CI

# Portão de qualidade do Aula em Dia. Roda a cada push e em todo PR contra a main.
# Existe porque três pessoas trabalham em paralelo: sem isto, "os testes passam" é
# declaração de quem abriu o PR, não fato verificado.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um PR que recebe vários pushes cancela a execução anterior em vez de enfileirar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e tipos
    runs-on: ubuntu-latest
    # O app mora em mobile/, não na raiz do repositório.
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      # --ci faz o Jest falhar em vez de escrever snapshot novo, e
      # --runInBand evita a concorrência engolir memória no runner compartilhado.
      - name: Testes
        run: npm test -- --ci --runInBand

  # O teste de RLS (SCRUM-60). Com RLS ligada e sem política, o select volta vazio sem
  # erro: é a falha que nenhum teste do app pega, e até aqui dependia de alguém lembrar
  # de rodar `supabase test db`. Fica num job separado para o portão do app não esperar
  # o Postgres subir. Roda sempre, sem filtro de paths: check obrigatório com filtro fica
  # pendente para sempre no PR que não mexe no banco. Ainda NÃO é obrigatório; depois de
  # uma semana verde, quem administra a main o promove na proteção da branch.
  banco:
    name: RLS do banco
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # A versão em que o seed e os testes foram escritos (SCRUM-18). A forma de
      # auth.users muda entre versões do CLI: subir esta é decisão, não acidente.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # Só o Postgres, que o runner sobe no Docker que já tem. Aplica as migrações e o
      # supabase/seed.sql, sem Auth, Studio nem API. Banco local, que morre com o job:
      # nenhuma chave nem projeto da nuvem.
      - name: Subir o banco
        run: supabase db start

      # Os testes pgTAP de supabase/tests/database: RLS com dois professores e o
      # trigger que cria o professor.
      - name: Testes do banco
        run: supabase test db

  # A Edge Function do link do aluno (SCRUM-81, P2-5 da revisão da Parte 6). Ela usa a
  # service role, então a RLS não a protege: o filtro pelo token é a única barreira, e
  # este job prova que ela só entrega o aluno do link. Fica separado do job de RLS porque
  # precisa do gateway e do Auth, e não só do Postgres. Banco local, que morre com o job:
  # nenhuma chave nem projeto da nuvem.
  funcao:
    name: Função do aluno
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # O bundle do domínio fica fora do git (Parte 6, decisão 10): sem ele a função
      # não sobe.
      - name: Gerar o bundle do domínio
        working-directory: mobile
        run: |
          npm ci
          npm run bundle:dominio

      # A mesma versão dos outros jobs.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # Sem o que o teste não usa, para subir mais rápido. A saída vai para o lixo: no fim,
      # o `start` imprime as chaves locais. São as padrão de qualquer Supabase local, mas o
      # log do CI é público. Os erros continuam aparecendo, porque vão para o stderr.
      - name: Subir o Supabase
        run: supabase start -x studio,imgproxy,inbucket,realtime,storage-api,logflare,vector,supavisor > /dev/null

      # Em segundo plano; o teste espera a função responder antes de começar.
      - name: Servir a função
        run: supabase functions serve aluno-publico > "$RUNNER_TEMP/funcao.log" 2>&1 &

      # Sem `set -x`: as chaves locais não vão para o log, mesmo sendo as de exemplo.
      - name: Testar a função
        run: |
          set -a
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|PUBLISHABLE_KEY)=')"
          set +a
          node supabase/tests/funcoes/aluno-publico.test.mjs

      # Só o que a função escreveu: ela não registra o pedido, que leva o token.
      - name: Log da função
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP/funcao.log"
