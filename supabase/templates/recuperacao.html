<!--
  O e-mail de "Esqueci minha senha" (SCRUM-62).

  O mesmo texto vai no painel do Supabase da nuvem, em Auth → Email Templates →
  Reset Password; aqui ele vale para o Supabase local (config.toml).

  O link é o do fluxo com token_hash, e não o PKCE (`?code=`): o verificador
  do PKCE fica no aparelho que pediu, e o link aberto em outro navegador
  falharia. Com o token_hash, a tela de nova senha chama `verifyOtp`, e
  funciona em qualquer navegador. O `RedirectTo` é o
  `<EXPO_PUBLIC_URL_DO_APP>/redefinir-senha` que o app manda no pedido.
-->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#F2F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1C2330;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px;">
      <tr>
        <td style="padding:32px 28px;">
          <p style="margin:0 0 8px;font-size:13px;color:#5B6576;">Aula em Dia</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Redefinir a senha</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">
            Recebemos um pedido para trocar a senha da sua conta. Toque no botão para escolher uma senha nova.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;padding:14px 22px;border-radius:12px;background:#35577D;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;">
              Escolher uma senha nova
            </a>
          </p>
          <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#5B6576;">
            O link vale por uma hora e funciona uma vez só.
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#5B6576;">
            Não foi você? Pode ignorar este e-mail: sua senha continua a mesma.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
